<head>

<style>
:root{--w:#FFFFFF;--iv:#FFFDF8;--gold:#B89450;--lg:#E8D7AE;--tx:#29251F;--tx2:#77716A;--bd:#EEE7DA;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--tx);background:var(--w);line-height:1.55;overflow-x:hidden}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.2}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
/* header */
header.top{position:sticky;top:0;z-index:30;background:var(--w);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0)}
header.top:before{content:"";display:block;height:3px;background:var(--gold)}
.hbar{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;text-align:left}
.logo{width:34px;height:34px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);color:var(--gold);font-size:15px}
.bname{font-family:var(--serif);font-size:18px;letter-spacing:.02em}
.hr{display:flex;gap:6px;align-items:center}
.ib{position:relative;width:44px;height:44px;border:1px solid var(--bd);background:var(--w);border-radius:2px;cursor:pointer;display:grid;place-items:center}
.ib svg{width:22px;height:22px;stroke:var(--tx);fill:none;stroke-width:1.6}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.badge:empty{display:none}
/* drawer */
.backdrop{position:fixed;inset:0;background:rgba(41,37,31,.35);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:50}
.backdrop.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);max-width:100vw;background:var(--iv);border-left:1px solid var(--gold);z-index:60;transform:translateX(100%);visibility:hidden;transition:transform .28s ease,visibility .28s;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.drawer.on{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--lg)}
.dnav{flex:1;overflow-y:auto;padding:8px 0}
.dnav button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:15px 22px;font-family:var(--serif);font-size:18px;cursor:pointer}
.dnav button.act{color:var(--gold)}
.lang{display:flex;gap:0;margin:16px 22px}
.lang button{flex:1;border:1px solid var(--gold);background:var(--w);padding:9px;cursor:pointer;font-size:14px}
.lang button.on{background:var(--gold);color:#fff}
.dfoot{border-top:1px solid var(--lg);padding:14px 22px;font-size:13px;color:var(--tx2)}
.dfoot a{color:var(--gold)}
/* pages */
.page{display:none}
.page.on{display:block;animation:fi .25s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sec{padding:44px 0}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.divider{width:56px;height:2px;background:var(--gold);margin:14px 0}
.center{text-align:center}.center .divider{margin:14px auto}
h2{font-size:28px}
.sub{color:var(--tx2);margin-top:6px}
.btn{display:inline-block;border:1px solid var(--gold);background:var(--gold);color:#fff;padding:12px 22px;cursor:pointer;text-decoration:none;font-size:14px;letter-spacing:.04em;border-radius:2px;min-height:44px}
.btn.o{background:var(--w);color:var(--gold)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
/* hero */
.hero{background:var(--iv);display:grid;gap:0}
.hero .txt{padding:36px 18px}
.hero h1{font-size:40px}
.hero .tag{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--gold);margin-top:8px}
.rate{display:inline-block;border:1px solid var(--lg);background:var(--w);padding:6px 12px;font-size:13px;margin-top:16px}
.hero .img{aspect-ratio:4/3}
.ph{width:100%;height:100%;object-fit:cover;background:var(--iv)}
@media(min-width:800px){.hero{grid-template-columns:1fr 1fr;align-items:stretch}.hero .txt{padding:70px 40px 70px max(18px,calc((100vw - 1100px)/2))}.hero h1{font-size:56px}.hero .img{aspect-ratio:auto;min-height:420px}}
/* marquee */
.marq{border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);background:var(--iv);overflow:hidden;white-space:nowrap}
.mt{display:inline-flex;animation:mq 28s linear infinite;will-change:transform}
.mt span{padding:9px 0;font-size:12px;letter-spacing:.18em;color:var(--gold);font-family:var(--serif)}
.mt span:after{content:"  ◆  ";font-size:8px;padding:0 10px}
@keyframes mq{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.mt{animation:none}.page.on{animation:none}.drawer,.backdrop{transition:none}}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:22px}
.gal div{aspect-ratio:1/1;overflow:hidden;border:1px solid var(--bd)}
.gal div:first-child{grid-column:span 2;aspect-ratio:2/1}
.gal img{width:100%;height:100%;object-fit:cover}
@media(min-width:800px){.gal{grid-template-columns:repeat(4,1fr)}.gal div:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}.gal img{transition:transform .4s}.gal div:hover img{transform:scale(1.04)}}
/* cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
@media(max-width:340px){.grid{grid-template-columns:1fr}}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}
.card{border:1px solid var(--bd);background:var(--w);display:flex;flex-direction:column}
.card .im{aspect-ratio:1/1;overflow:hidden;background:var(--iv)}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:16px}
.card p{font-size:13px;color:var(--tx2)}
.price{color:var(--gold);font-family:var(--serif);font-size:17px;margin-top:auto}
.row{display:flex;gap:8px;align-items:center}
.qty{display:inline-flex;border:1px solid var(--bd)}
.qty button{width:34px;height:36px;background:var(--iv);border:0;cursor:pointer;font-size:18px}
.qty span{min-width:30px;text-align:center;line-height:36px;font-size:14px}
.card .btn{padding:8px 10px;font-size:13px;min-height:38px;flex:1;text-align:center}
.cats{display:grid;gap:12px;grid-template-columns:1fr;margin-top:22px}
@media(min-width:700px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{border:1px solid var(--lg);background:var(--iv);padding:26px 18px;text-align:center;cursor:pointer;font-family:var(--serif);font-size:20px;border-top:3px solid var(--gold)}
.cat small{display:block;font-family:var(--sans);font-size:13px;color:var(--tx2);margin-top:4px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-top:18px}
.filters button{white-space:nowrap;border:1px solid var(--bd);background:var(--w);padding:9px 16px;cursor:pointer;font-size:14px;min-height:40px}
.filters button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.note{background:var(--iv);border:1px dashed var(--lg);padding:10px 14px;font-size:13px;color:var(--tx2);margin-top:16px}
.pghead{background:var(--iv);border-bottom:1px solid var(--bd);padding:34px 0 24px}
/* forms */
.form{background:var(--iv);border:1px solid var(--lg);padding:20px;display:grid;gap:14px;margin-top:20px}
.f label{display:block;font-size:13px;margin-bottom:4px;color:var(--tx2)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--bd);background:var(--w);padding:11px;border-radius:2px;min-height:44px}
.f textarea{min-height:80px;resize:vertical}
.f.bad input,.f.bad select,.f.bad textarea{border-color:#b3472f}
.err{color:#b3472f;font-size:12px;margin-top:3px;min-height:0}
.two{display:grid;gap:14px}
@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
/* cart */
.ci{display:grid;grid-template-columns:64px 1fr;gap:12px;border-bottom:1px solid var(--bd);padding:14px 0}
.ci img{width:64px;height:64px;object-fit:cover}
.ci .r{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:6px}
.rm{background:none;border:0;color:#b3472f;cursor:pointer;font-size:13px;text-decoration:underline;min-height:36px}
.tot{display:flex;justify-content:space-between;font-family:var(--serif);font-size:22px;padding:16px 0;border-top:2px solid var(--gold)}
.cartwrap{display:grid;gap:24px}
@media(min-width:800px){.cartwrap{grid-template-columns:1.2fr 1fr}}
.empty{text-align:center;padding:30px 0;color:var(--tx2)}
/* contact */
.cg{display:grid;gap:22px;margin-top:20px}
@media(min-width:800px){.cg{grid-template-columns:1fr 1.3fr}}
.info{border:1px solid var(--lg);background:var(--iv);padding:20px;display:grid;gap:10px;align-content:start}
.map{border:1px solid var(--lg);aspect-ratio:4/3;background:var(--iv);display:grid;place-items:center;text-align:center;padding:14px;color:var(--tx2)}
.map iframe{width:100%;height:100%;border:0}
/* footer */
.foot{border-top:2px solid var(--gold);background:var(--iv);margin-top:30px;padding:28px 0 90px;font-size:14px}
.fg{display:grid;gap:18px}
@media(min-width:800px){.fg{grid-template-columns:1.3fr 1fr 1fr}}
.foot h4{font-family:var(--serif);font-weight:500;font-size:16px;margin-bottom:6px}
.foot nav{display:flex;flex-direction:column;align-items:flex-start}
.foot nav button,.foot nav a{background:none;border:0;padding:5px 0;cursor:pointer;text-align:left;color:var(--tx2);text-decoration:none;font-size:14px}
.fx{margin-top:20px;padding-top:14px;border-top:1px solid var(--lg);font-size:13px;color:var(--tx2);display:flex;flex-wrap:wrap;gap:6px 16px}
.fx a{color:var(--gold)}
/* fab + toast */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:40;width:54px;height:54px;border-radius:50%;background:#fff;border:1px solid var(--lg);box-shadow:0 2px 10px rgba(41,37,31,.18);display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.fab svg{width:30px;height:30px;fill:#25D366}
@media(hover:hover){.fab:hover{transform:scale(1.06)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;font-size:14px;z-index:70;max-width:88vw;text-align:center;display:none;border-radius:2px}
.toast.on{display:block}
</style>
</head>

cart:"कार्ट",menu:"मेन्यू",close:"बंद करें",fab:"WhatsApp पर CitySeller Cakes से चैट करें"}

/* ===== 3. STATE ===== */
const PAGES = ["home","menu","custom-cakes","cart","contact"];
const state = {lang:"en",cat:"all",cart:{},cur:"home",q:{}};
const $ = (s,r=document)=>r.querySelector(s), $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const t = k => (I18N[state.lang][k]!==undefined?I18N[state.lang][k]:I18N.en[k])||k;
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupee = n => "₹"+n.toLocaleString("en-IN");
function store(op,k,v){try{return op==="get"?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}}
function ph(label){const s='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="#FFFDF8"/><rect x="20" y="20" width="760" height="560" fill="none" stroke="#E8D7AE" stroke-width="2"/><text x="400" y="290" font-family="Georgia,serif" font-size="80" fill="#B89450" text-anchor="middle">🎂</text><text x="400" y="360" font-family="Georgia,serif" font-size="26" fill="#B89450" text-anchor="middle">'+label+'</text></svg>';return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s)}
function imgTag(src,alt,lazy,w,h,label){const p=ph(label||"Demo image");return '<img src="'+esc(src||p)+'" alt="'+esc(alt)+'" width="'+w+'" height="'+h+'"'+(lazy?' loading="lazy"':'')+' onerror="this.onerror=null;this.src=\''+p+'\'">'}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}
const validNum = n => /^\d{10,15}$/.test(String(n||"").replace(/\D/g,""));
const digits = n => String(n||"").replace(/\D/g,"");
const pname = p => state.lang==="hi"?p.nameHi:p.nameEn;
/* ===== 4. NAVIGATION ===== */
function go(page,opts){if(!PAGES.includes(page))page="home";if(location.hash.slice(1)!==page){location.hash=page}else{show(page)}}
function show(page){
  if(!PAGES.includes(page))page="home";
  state.cur=page;
  $$(".page").forEach(p=>p.classList.toggle("on",p.dataset.page===page));
  $$(".dnav [data-go]").forEach(b=>b.classList.toggle("act",b.dataset.go===page));
  window.scrollTo(0,0);
  if(page==="menu")renderMenu(); if(page==="cart")renderCart();
  document.title=(page==="home"?"":t({"menu":"nMenu","custom-cakes":"nCustom","cart":"nCart","contact":"nContact"}[page])+" – ")+"CitySeller Cakes";
}
window.addEventListener("hashchange",()=>{closeDrawer(true);show(location.hash.slice(1))});
/* ===== 5. DRAWER ===== */
let lastFocus=null;
function openDrawer(){lastFocus=document.activeElement;$("#drawer").classList.add("on");$("#backdrop").classList.add("on");document.body.classList.add("lock");$("#menuBtn").setAttribute("aria-expanded","true");setTimeout(()=>$("#closeBtn").focus(),50)}
function closeDrawer(skipFocus){if(!$("#drawer").classList.contains("on"))return;$("#drawer").classList.remove("on");$("#backdrop").classList.remove("on");document.body.classList.remove("lock");$("#menuBtn").setAttribute("aria-expanded","false");if(!skipFocus&&lastFocus)lastFocus.focus()}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeDrawer();
  if(e.key==="Tab"&&$("#drawer").classList.contains("on")){
    const f=$$("#drawer button, #drawer a").filter(x=>x.offsetParent!==null);if(!f.length)return;
    const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  }
  if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.cat){e.preventDefault();pickCat(e.target.dataset.cat)}
});
/* ===== 6. PRODUCT RENDERING ===== */
function cardHTML(p,withQty){
  const q=state.q[p.id]||1;
  return '<article class="card"><div class="im">'+imgTag(p.image,pname(p),true,400,400,"Demo")+'</div><div class="b"><h3>'+esc(pname(p))+'</h3>'
  +(withQty?'<p>'+esc(state.lang==="hi"?p.descriptionHi:p.descriptionEn)+'</p>':'')
  +'<div class="price">'+rupee(p.price)+'</div>'
  +(withQty?'<div class="qty" data-qtybox="'+p.id+'"><button data-act="qminus" data-id="'+p.id+'" aria-label="−">−</button><span>'+q+'</span><button data-act="qplus" data-id="'+p.id+'" aria-label="+">+</button></div>':'')
  +(p.available?'<button class="btn" data-act="add" data-id="'+p.id+'" data-wq="'+(withQty?1:0)+'">'+t("add")+'</button>':'<button class="btn o" disabled>'+t("unavail")+'</button>')
  +'</div></article>';
}
function renderFeatured(){$("#featGrid").innerHTML=FEATURED_IDS.map(id=>MENU.find(p=>p.id===id)).filter(Boolean).map(p=>cardHTML(p,false)).join("")}
function renderMenu(){
  const L={all:"all",cakes:"catCakes",pastries:"catPast",custom:"catCust"};
  $("#filters").innerHTML=Object.keys(L).map(c=>'<button data-filter="'+c+'" class="'+(state.cat===c?"on":"")+'">'+t(L[c])+'</button>').join("");
  $("#menuGrid").innerHTML=MENU.filter(p=>state.cat==="all"||p.category===state.cat).map(p=>cardHTML(p,true)).join("");
}
function renderGallery(){
  $("#gal").innerHTML=GALLERY_IMAGES.map((u,i)=>'<div>'+imgTag(u,"CitySeller Cakes cake photo "+(i+1),true,600,600,"Demo image")+'</div>').join("");
  $$("[data-img]").forEach(im=>{im.src=GALLERY_IMAGES[+im.dataset.img]||ph("Demo image");im.onerror=function(){this.onerror=null;this.src=ph("Demo image")}});
}
function pickCat(c){state.cat=c;go("menu");if(state.cur==="menu")renderMenu()}
/* ===== 7. CART ===== */
function loadCart(){try{const c=JSON.parse(store("get","csc_cart")||"{}");if(c&&typeof c==="object")state.cart=c}catch(e){}}
function saveCart(){store("set","csc_cart",JSON.stringify(state.cart))}
function cartItems(){return Object.keys(state.cart).map(id=>({p:MENU.find(m=>m.id===id),q:state.cart[id]})).filter(x=>x.p&&x.q>0)}
function cartTotal(){return cartItems().reduce((s,x)=>s+x.p.price*x.q,0)}
function updBadge(){const n=cartItems().reduce((s,x)=>s+x.q,0);$("#cartCount").textContent=n||""}
function setQty(id,q){if(q<=0)delete state.cart[id];else state.cart[id]=Math.min(q,50);saveCart();updBadge();renderCart()}
function renderCart(){
  const it=cartItems(),box=$("#cartList");
  if(!it.length){box.innerHTML='<div class="empty"><p>'+t("cartEmpty")+'</p><div class="btns" style="justify-content:center"><button class="btn" data-go="menu">'+t("browse")+'</button></div></div>';return}
  box.innerHTML=it.map(x=>'<div class="ci">'+imgTag(x.p.image,pname(x.p),true,64,64,"")+'<div><strong>'+esc(pname(x.p))+'</strong><div class="sub" style="font-size:13px">'+rupee(x.p.price)+'</div>'
  +'<div class="r"><div class="qty"><button data-act="cminus" data-id="'+x.p.id+'" aria-label="−">−</button><span>'+x.q+'</span><button data-act="cplus" data-id="'+x.p.id+'" aria-label="+">+</button></div><strong>'+rupee(x.p.price*x.q)+'</strong><button class="rm" data-act="crm" data-id="'+x.p.id+'">'+t("remove")+'</button></div></div></div>').join("")
  +'<div class="tot"><span>'+t("total")+'</span><span>'+rupee(cartTotal())+'</span></div>';
}
/* ===== 8. WHATSAPP ===== */
function openWa(text){
  if(!validNum(BUSINESS_CONFIG.whatsapp)){toast(t("noWa"));return false}
  const w=window.open("https://wa.me/"+digits(BUSINESS_CONFIG.whatsapp)+"?text="+encodeURIComponent(text),"_blank","noopener");
  if(!w)location.href="https://wa.me/"+digits(BUSINESS_CONFIG.whatsapp)+"?text="+encodeURIComponent(text);
  return true;
}
function setErr(input,msg){const f=input.closest(".f");f.classList.toggle("bad",!!msg);const e=$(".err",f);if(e)e.textContent=msg||""}
function req(input){const ok=input.value.trim()!=="";setErr(input,ok?"":t("req"));return ok}
function phoneOk(input){const v=input.value.trim();if(!v){setErr(input,t("req"));return false}if(!validNum(v)){setErr(input,t("badPhone"));return false}setErr(input,"");return true}
function submitCheckout(){
  const n=$("#kName"),p=$("#kPhone"),a=$("#kAddr");
  const ok=[req(n),phoneOk(p),req(a)].every(Boolean);
  if(!cartItems().length){toast(t("cartEmpty"));return}
  if(!ok)return;
  let m="*New order – CitySeller Cakes*\nName: "+n.value.trim()+"\nPhone: "+p.value.trim()+"\nAddress: "+a.value.trim()+"\n\n*Items*\n";
  cartItems().forEach((x,i)=>{m+=(i+1)+". "+x.p.nameEn+" × "+x.q+" @ "+rupee(x.p.price)+" = "+rupee(x.p.price*x.q)+"\n"});
  m+="\n*Grand total: "+rupee(cartTotal())+"*";
  if($("#kNote").value.trim())m+="\nNotes: "+$("#kNote").value.trim();
  openWa(m);
}
/* ===== 9. CUSTOM CAKE ===== */
function fillOptions(){
  const o=CUSTOM_OPTIONS,fill=(id,arr)=>{const s=$(id),v=s.value;s.innerHTML=arr.map(x=>'<option>'+esc(x)+'</option>').join("");if(v)s.value=v};
  fill("#cFlavour",o.flavours);fill("#cWeight",o.weights);fill("#cShape",o.shapes);
}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function submitCustom(){
  const n=$("#cName"),p=$("#cPhone"),d=$("#cDate");
  let dOk=req(d);if(dOk&&d.value<todayStr()){setErr(d,t("badDate"));dOk=false}
  const ok=[req(n),phoneOk(p),dOk].every(Boolean);if(!ok)return;
  const m="*Custom cake request – CitySeller Cakes*\nName: "+n.value.trim()+"\nPhone: "+p.value.trim()+"\nFlavour: "+$("#cFlavour").value+"\nWeight: "+$("#cWeight").value+"\nShape/design: "+$("#cShape").value+"\nMessage on cake: "+($("#cMsg").value.trim()||"-")+"\nRequired date: "+d.value+"\nMode: "+$("#cMode").value+"\nInstructions: "+($("#cNote").value.trim()||"-");
  openWa(m);
}
/* ===== 11. FOOTER + CONTACT RENDERING ===== */
function footerHTML(){
  const C=BUSINESS_CONFIG,fx=C.fantovexContactUrl?'<a href="'+esc(C.fantovexContactUrl)+'" target="_blank" rel="noopener noreferrer">'+t("fxContact")+'</a>':'<span>'+t("fxContact")+": "+t("notSet")+'</span>';
  const nav=[["home","nHome"],["menu","nMenu"],["custom-cakes","nCustom"],["cart","nCart"],["contact","nContact"]].map(x=>'<button data-go="'+x[0]+'">'+t(x[1])+'</button>').join("");
  return '<div class="wrap"><div class="fg"><div><h4>CitySeller Cakes</h4><p class="sub">'+esc(C.address)+'</p><p class="sub" style="font-family:Georgia,serif;font-style:italic">'+t("tagline")+'</p></div>'
  +'<div><h4>'+t("fLinks")+'</h4><nav>'+nav+'</nav></div>'
  +'<div><h4>'+t("fConnect")+'</h4><nav><a href="'+esc(C.instagram)+'" target="_blank" rel="noopener noreferrer">Instagram</a><button data-act="call">'+t("callNow")+'</button><button data-act="wa">WhatsApp</button></nav></div></div>'
  +'<div class="fx"><span>'+t("powered")+' <a href="'+esc(C.fantovexWebsite)+'" target="_blank" rel="noopener noreferrer">Fantovex</a></span><span>'+t("fdev")+'</span>'+fx+'</div></div>';
}
function renderFooters(){$$("[data-footer]").forEach(f=>f.innerHTML=footerHTML())}
function renderContact(){
  const C=BUSINESS_CONFIG;
  $("#cAddr").textContent=C.address;
  $("#cHours").textContent=C.openingHours||t("notSet");
  $("#igBtn").href=C.instagram;
  const dir=C.googleMapsDirectionsUrl||"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("CitySeller Cakes, "+C.address);
  $("#dirBtn").href=dir;
  const mb=$("#mapBox");
  if(C.googleMapsEmbedUrl){mb.innerHTML='<iframe title="CitySeller Cakes map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="'+esc(C.googleMapsEmbedUrl)+'"></iframe>';mb.style.padding="0";mb.style.display="block"}
  else{mb.innerHTML='<div><p>'+t("mapFallback")+'</p><p style="margin-top:8px"><a href="'+esc(dir)+'" target="_blank" rel="noopener noreferrer" style="color:#B89450">'+t("directions")+'</a></p></div>'}
  $("#dfx").innerHTML=C.fantovexContactUrl?'<a href="'+esc(C.fantovexContactUrl)+'" target="_blank" rel="noopener noreferrer">'+t("fxContact")+'</a>':t("fxContact")+": "+t("notSet");
}
/* ===== 10b. LANGUAGE APPLY ===== */
function applyLang(){
  document.documentElement.lang=state.lang;
  $$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  $$("[data-aria]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.aria)));
  $$("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===state.lang));
  const m=["FRESHLY BAKED","MADE FOR EVERY CELEBRATION","CITYSELLER CAKES","DEOGHAR'S FAVOURITE CAKES"];
  const mh=["ताज़ा बेक्ड","हर जश्न के लिए","CITYSELLER CAKES","देवघर के फेवरेट केक"];
  const row=(state.lang==="hi"?mh:m).map(x=>"<span>"+x+"</span>").join("");
  $("#mq").innerHTML=row+row+row+row;
  renderFooters();renderFeatured();renderContact();renderCart();if(state.cur==="menu")renderMenu();
  ["#cName","#cPhone","#cDate","#kName","#kPhone","#kAddr"].forEach(s=>setErr($(s),""));
  fillOptions();
}
/* ===== 12. EVENTS (single delegated set, bound once) ===== */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-go],[data-act],[data-cat],[data-filter],[data-lang]");
  if(!el){if(e.target.id==="backdrop")closeDrawer();return}
  if(el.dataset.go){closeDrawer(true);go(el.dataset.go);return}
  if(el.dataset.cat){pickCat(el.dataset.cat);return}
  if(el.dataset.filter){state.cat=el.dataset.filter;renderMenu();return}
  if(el.dataset.lang){state.lang=el.dataset.lang;store("set","csc_lang",state.lang);applyLang();return}
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="wa"){openWa(t("gen"))}
  else if(a==="call"){if(!BUSINESS_CONFIG.phone||!validNum(BUSINESS_CONFIG.phone))toast(t("noCall"));else location.href="tel:+"+digits(BUSINESS_CONFIG.phone)}
  else if(a==="qplus"||a==="qminus"){state.q[id]=Math.max(1,Math.min(50,(state.q[id]||1)+(a==="qplus"?1:-1)));const s=$('[data-qtybox="'+id+'"] span');if(s)s.textContent=state.q[id]}
  else if(a==="add"){const q=el.dataset.wq==="1"?(state.q[id]||1):1;setQty(id,(state.cart[id]||0)+q);toast(t("added"))}
  else if(a==="cplus")setQty(id,(state.cart[id]||0)+1);
  else if(a==="cminus")setQty(id,(state.cart[id]||0)-1);
  else if(a==="crm")setQty(id,0);
});
$("#menuBtn").addEventListener("click",openDrawer);
$("#closeBtn").addEventListener("click",()=>closeDrawer());
$("#customForm").addEventListener("submit",e=>{e.preventDefault();submitCustom()});
$("#checkForm").addEventListener("submit",e=>{e.preventDefault();submitCheckout()});
/* ===== INIT ===== */
(function init(){
  const sl=store("get","csc_lang");if(sl==="hi"||sl==="en")state.lang=sl;
  loadCart();updBadge();
  $("#cDate").min=todayStr();
  renderGallery();applyLang();
  const h=location.hash.slice(1);show(PAGES.includes(h)?h:"home");
})();
</script>
