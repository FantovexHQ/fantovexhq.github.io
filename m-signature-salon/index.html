/* ===== 3. STATE ===== */
const PAGES=["home","services","bridal","gallery","contact"];
const S={lang:"en",tab:"hair",cur:"home"};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const t=k=>I18N[S.lang][k]!==undefined?I18N[S.lang][k]:I18N.en[k];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=(o,k)=>S.lang==="hi"&&o[k+"h"]!==undefined?o[k+"h"]:(S.lang==="hi"&&o.hi&&k==="n"?o.hi:o[k==="n"?"en":k]);
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}
function sv(i){return SERVICES[i]}
/* ===== 4. NAVIGATION ===== */
function show(p){if(!PAGES.includes(p))p="home";S.cur=p;$$(".page").forEach(e=>e.classList.toggle("on",e.dataset.page===p));$$(".dn .nav").forEach(b=>b.classList.toggle("act",b.dataset.go===p));window.scrollTo(0,0)}
function go(p){if(location.hash.slice(1)===p)show(p);else location.hash=p}
window.addEventListener("hashchange",()=>{closeDr(true);closeMd();show(location.hash.slice(1))});
/* ===== 5. DRAWER ===== */
let lf=null;
function openDr(){lf=document.activeElement;$("#dr").classList.add("on");$("#bd").classList.add("on");document.body.classList.add("lock");$("#mBtn").setAttribute("aria-expanded","true");setTimeout(()=>$("#cBtn").focus(),50)}
function closeDr(skip){if(!$("#dr").classList.contains("on"))return;$("#dr").classList.remove("on");$("#bd").classList.remove("on");if(!$("#md").classList.contains("on"))document.body.classList.remove("lock");$("#mBtn").setAttribute("aria-expanded","false");if(!skip&&lf)lf.focus()}
/* ===== 6. RENDERING ===== */
function ph(label,idx){const src=CFG.images[idx];return src?'<img src="'+esc(src)+'" alt="'+esc(label)+'" loading="lazy" onerror="this.remove()">':""}
function renderPh(){$$("[data-ph]").forEach(e=>{const i=+e.dataset.ph,lab=e.dataset.lab;const g=GAL.find(x=>x.i===i);const lb=g?(S.lang==="hi"?g.hi:g.en):lab;e.innerHTML=ph(lb,i)+'<span>'+esc(lb)+'<em>DEMO PLACEHOLDER</em></span>';e.setAttribute("role","img");e.setAttribute("aria-label",lb+" – demo placeholder")})}
function renderTabs(){$("#tabs").innerHTML=TABS.map(x=>'<button role="tab" data-tab="'+x.id+'" class="'+(S.tab===x.id?"on":"")+'" aria-selected="'+(S.tab===x.id)+'">'+esc(S.lang==="hi"?x.hi:x.en)+'</button>').join("");
 $("#svList").innerHTML=SERVICES.map((s,i)=>s.c!==S.tab?"":'<div class="sv"><div><h3>'+esc(S.lang==="hi"?s.hi:s.en)+'</h3><p>'+esc(S.lang==="hi"?s.dh:s.de)+'</p></div><div class="pr">'+esc(S.lang==="hi"&&s.ph?s.ph:s.p)+'</div><button class="bk" data-bks="'+i+'">'+t("book")+'</button></div>').join("")}
function renderGal(){$("#gg").innerHTML=GAL.map(g=>'<div class="ph" data-ph="'+g.i+'" data-lab="'+esc(g.en)+'"></div>').join("")}
function renderSel(){const s=$("#bs"),v=s.value;s.innerHTML='<option value="">'+t("choose")+'</option>'+SERVICES.map((x,i)=>'<option value="'+i+'">'+esc(S.lang==="hi"?x.hi:x.en)+'</option>').join("");if(v)s.value=v}
/* ===== 11. FOOTER ===== */
function footHTML(){
 const nav=[["home","nHome"],["services","nServ"],["bridal","nBridal"],["gallery","nGal"],["contact","nContact"]].map(x=>'<button data-go="'+x[0]+'">'+t(x[1])+'</button>').join("");
 const fxc=CFG.fxContact?' <a href="'+esc(CFG.fxContact)+'" target="_blank" rel="noopener noreferrer">Contact Fantovex</a>':' <a href="'+CFG.fx+'" target="_blank" rel="noopener noreferrer">Contact Fantovex</a>';
 return '<div class="wrap"><div class="fg"><div><h4>M Signature Unisex Salon</h4><p class="sub">Court Road, Williams Town, Deoghar</p></div><div><h4>'+t("fLinks")+'</h4><nav>'+nav+'</nav></div><div><h4>'+t("fCall")+'</h4><nav><a href="tel:+916205136925">6205136925</a><a href="tel:+919933889700">9933889700</a></nav></div></div>'
 +'<div class="fx"><span>'+t("fx")+'</span><span><a href="'+CFG.fx+'" target="_blank" rel="noopener noreferrer">Powered by Fantovex</a></span><span>'+fxc.trim()+'</span></div></div>'}
/* ===== 8. WHATSAPP ===== */
function waUrl(msg){return "https://wa.me/"+CFG.wa+"?text="+encodeURIComponent(msg)}
function openWa(msg){const w=window.open(waUrl(msg),"_blank","noopener");if(!w)location.href=waUrl(msg)}
function waMsg(kind){return kind==="bridal"?"Hello, I would like to enquire about bridal makeup at M Signature Unisex Salon.":"Hello, I would like to enquire about services and booking at M Signature Unisex Salon."}
function bookService(i){const s=sv(i);openWa("Hello M Signature Unisex Salon!\nI would like to request a booking.\n\nService: "+s.en+" (sample price "+s.p+")\n\nPlease confirm availability and actual pricing.")}
/* ===== 9. BOOKING FORM ===== */
let mf=null;
function openMd(idx){mf=document.activeElement;if(idx!==undefined&&idx!=="")$("#bs").value=idx;$("#bd2").min=today();$("#md").classList.add("on");document.body.classList.add("lock");setTimeout(()=>$("#bn").focus(),50)}
function closeMd(){if(!$("#md").classList.contains("on"))return;$("#md").classList.remove("on");if(!$("#dr").classList.contains("on"))document.body.classList.remove("lock");if(mf)mf.focus()}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function err(el,m){const f=el.closest(".f");f.classList.toggle("bad",!!m);const e=$(".er",f);if(e)e.textContent=m||""}
function submitBook(){
 const n=$("#bn"),s=$("#bs"),d=$("#bd2"),tm=$("#bt");
 const a=n.value.trim()?(err(n,""),true):(err(n,t("req")),false);
 const b=s.value!==""?(s.closest(".f").classList.remove("bad"),true):(s.closest(".f").classList.add("bad"),false);
 let c=true;if(!d.value){err(d,t("req"));c=false}else if(d.value<today()){err(d,t("pastDate"));c=false}else err(d,"");
 const e=tm.value?(err(tm,""),true):(err(tm,t("req")),false);
 if(!(a&&b&&c&&e))return;
 const ph=$("#bp").value.trim(),m=$("#bm").value.trim(),x=sv(+s.value);
 openWa("Hello M Signature Unisex Salon!\nI would like to request a booking.\n\nName: "+n.value.trim()+(ph?"\nPhone: "+ph:"")+"\nService: "+x.en+"\nPreferred Date: "+d.value+"\nPreferred Time: "+tm.value+(m?"\nMessage: "+m:"")+"\n\nPlease confirm availability and actual pricing.");
 closeMd();
}
/* ===== LANGUAGE ===== */
function applyLang(){
 document.documentElement.lang=S.lang==="hi"?"hi":"en";
 $$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 $$("[data-aria]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.aria)));
 $$("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===S.lang));
 const r=CFG.marquee.map(x=>"<span>"+esc(x)+"</span>").join("");$("#mt").innerHTML=r+r+r+r;
 $$("[data-ft]").forEach(f=>f.innerHTML=footHTML());
 renderTabs();renderGal();renderPh();renderSel();
}
/* ===== 12. EVENTS ===== */
document.addEventListener("click",e=>{
 if(e.target.id==="bd"){closeDr();return}
 if(e.target.id==="md"){closeMd();return}
 const el=e.target.closest("[data-go],[data-book],[data-wa],[data-tab],[data-bks],[data-lang]");if(!el)return;
 if(el.dataset.go){closeDr(true);go(el.dataset.go)}
 else if(el.hasAttribute("data-book")){closeDr(true);openMd()}
 else if(el.dataset.wa){e.preventDefault();openWa(waMsg(el.dataset.wa))}
 else if(el.dataset.tab){S.tab=el.dataset.tab;renderTabs()}
 else if(el.dataset.bks!==undefined){bookService(+el.dataset.bks)}
 else if(el.dataset.lang){S.lang=el.dataset.lang;try{localStorage.setItem("ms_lang",S.lang)}catch(x){}applyLang()}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){closeMd();closeDr()}
 if(e.key==="Tab"){const box=$("#md").classList.contains("on")?$("#md .mb"):$("#dr").classList.contains("on")?$("#dr"):null;if(!box)return;
  const f=$$("button,a,input,select,textarea",box).filter(x=>x.offsetParent!==null&&!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
$("#mBtn").addEventListener("click",openDr);
$("#cBtn").addEventListener("click",()=>closeDr());
$("#mClose").addEventListener("click",closeMd);
$("#bf").addEventListener("submit",e=>{e.preventDefault();submitBook()});
/* ===== INIT ===== */
(function(){
 try{const l=localStorage.getItem("ms_lang");if(l==="hi"||l==="en")S.lang=l}catch(x){}
 $("#dir").href=CFG.dir;$("#dir2").href=CFG.dir;
 applyLang();const h=location.hash.slice(1);show(PAGES.includes(h)?h:"home");
})();
</script>
